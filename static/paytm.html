<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#002E6E">
  <title>Customer's Paytm · Khata Saathi</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Hind+Guntur:wght@400;600&family=Hind+Madurai:wght@400;600&family=Hind+Mysuru:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    /* Mock of the customer's Paytm app. Paytm language: pale sky page, white cards, navy titles, sky-blue primary. */
    :root { --p-navy: #002E6E; --p-sky: #00BAF2; --p-sky-tint: #E6F7FE; --p-page: #EAF6FD; --p-ink: #101828; --p-ink-2: #667085; --p-line: #EAECF0; }
    body.pt-page { margin: 0; background: var(--p-page); color: var(--p-ink); font-family: "Hind", "Hind Madurai", "Hind Mysuru", "Hind Guntur", system-ui, sans-serif; }
    .pt { max-width: 440px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .pt-top { position: sticky; top: 0; z-index: 2; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; background: linear-gradient(180deg, #D6EEFB, #EAF6FD); }
    .pt-brand { display: flex; align-items: center; justify-content: space-between; }
    .pt-wordmark { font-weight: 800; font-size: 22px; letter-spacing: -.03em; }
    .pt-wordmark b { color: var(--p-navy); } .pt-wordmark i { font-style: normal; color: var(--p-sky); }
    .pt-you { margin: 6px 0 0; font-size: 12px; color: var(--p-ink-2); }
    .pt-you strong { color: var(--p-ink); font-weight: 600; }
    .pt-title { margin: 12px 0 0; font-size: 20px; font-weight: 800; color: var(--p-navy); }
    .pt-mute { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 12px; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,46,110,.08); font-size: 13px; }
    .pt-switch { width: 44px; height: 26px; border-radius: 999px; border: 0; background: #CBD5E1; position: relative; cursor: pointer; flex: none; }
    .pt-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
    .pt-switch.on { background: var(--p-sky); } .pt-switch.on::after { left: 21px; }
    .pt-list { flex: 1; padding: 12px 14px 40px; display: flex; flex-direction: column; gap: 10px; }
    .pt-card { background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 2px 12px rgba(0,46,110,.08); }
    .pt-card.unread { box-shadow: 0 2px 12px rgba(0,186,242,.25); }
    .pt-head { display: flex; align-items: center; gap: 10px; }
    .pt-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--p-navy); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
    .pt-shop { font-weight: 700; font-size: 14px; color: var(--p-navy); }
    .pt-time { margin-left: auto; font-size: 11px; color: var(--p-ink-2); }
    .pt-body { margin: 8px 0 0; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .pt-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .pt-btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
    .pt-btn.primary { background: var(--p-sky); color: #fff; } .pt-btn.primary:disabled { opacity: .5; cursor: default; }
    .pt-btn.ghost { background: var(--p-sky-tint); color: var(--p-navy); } .pt-btn.ghost:disabled { opacity: .5; cursor: default; }
    .pt-empty { padding: 40px 20px; text-align: center; color: var(--p-ink-2); font-size: 14px; }
    .pt-in { align-self: flex-end; font-size: 12px; color: var(--p-ink-2); background: #fff; border-radius: 999px; padding: 4px 10px; box-shadow: 0 1px 4px rgba(0,46,110,.08); }
    /* Payment sheet */
    .pt-sheet-bg { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: none; align-items: flex-end; justify-content: center; z-index: 5; }
    .pt-sheet-bg.open { display: flex; }
    .pt-sheet { width: min(100%, 440px); background: #fff; border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 32px rgba(0,31,77,.18); animation: pt-up .25s ease-out; }
    @keyframes pt-up { from { transform: translateY(100%); } to { transform: none; } }
    .pt-grab { width: 36px; height: 4px; border-radius: 2px; background: #CBD5E1; margin: 0 auto 8px; }
    .pt-sheet-top { display: flex; align-items: center; gap: 8px; height: 40px; }
    .pt-sheet-top h2 { margin: 0 auto; font-size: 16px; font-weight: 700; padding-right: 32px; }
    .pt-x { width: 32px; height: 32px; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--p-ink-2); }
    .pt-choose { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
    .pt-amount { display: flex; align-items: baseline; gap: 6px; font-size: 32px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 10px; }
    .pt-amount input { font: inherit; font-weight: 800; width: 100%; border: 0; border-bottom: 2px solid var(--p-sky); outline: none; color: var(--p-ink); background: transparent; }
    .pt-opt { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--p-line); font-size: 14px; cursor: pointer; }
    .pt-opt input { accent-color: var(--p-sky); width: 18px; height: 18px; }
    .pt-opt .ic { width: 28px; height: 28px; border-radius: 8px; background: var(--p-sky-tint); display: grid; place-items: center; font-size: 14px; }
    .pt-paybtn { width: 100%; margin: 10px 0 6px; padding: 14px; border: 0; border-radius: 12px; background: var(--p-sky); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; font-family: inherit; }
    .pt-paybtn:disabled { opacity: .5; cursor: default; }
    .pt-other { margin: 8px 0 0; font-size: 12px; color: var(--p-ink-2); }
    .pt-note { font-size: 11px; color: var(--p-ink-2); text-align: center; margin-top: 8px; }
    .pt-done { text-align: center; padding: 10px 0 4px; }
    .pt-done .mark { width: 64px; height: 64px; border-radius: 50%; background: #ECFDF3; color: #12B76A; display: grid; place-items: center; margin: 0 auto 10px; font-size: 30px; }
    .pt-done h3 { margin: 0; font-size: 22px; font-weight: 800; }
    .pt-done p { margin: 6px 0 0; color: var(--p-ink-2); font-size: 14px; }
    .pt-err { color: #C2410C; font-size: 13px; margin-top: 6px; }
    .simple-page .back-link, .pt .back-link { position: static; display: inline-block; margin: 0 0 6px; padding: 6px 10px 6px 6px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--p-navy); background: rgba(0,46,110,.08); }
  </style>
</head>
<body class="pt-page">
  <div class="pt">
    <header class="pt-top">
      <script src="/static/backbar.js"></script>
      <div class="pt-brand">
        <div class="pt-wordmark"><b>pay</b><i>tm</i></div>
      </div>
      <p class="pt-you"><span id="youAre">You are</span> <strong id="whoName">…</strong></p>
      <h1 class="pt-title" id="title">Notifications</h1>
      <div class="pt-mute">
        <span><strong id="shopName">Shop</strong> · <span id="muteLabel">Reminders from this shop</span></span>
        <button class="pt-switch on" id="mute" type="button" aria-label="Reminders from this shop"></button>
      </div>
    </header>
    <main class="pt-list" id="list" aria-live="polite"></main>
  </div>

  <div class="pt-sheet-bg" id="sheetBg">
    <div class="pt-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="pt-grab"></div>
      <div class="pt-sheet-top"><button class="pt-x" id="closeSheet" type="button" aria-label="Close">✕</button><h2 id="sheetTitle">Pay From</h2></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <script type="module" src="/static/paytm.js"></script>
</body>
</html>
